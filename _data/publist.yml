- title: "Regulatory analysis of single cell multiome gene expression and chromatin accessibility data with scREG"
  image: scREG.png
  description: We developed scREG, a dimension reduction methodology based on the concept of cis-regulatory potential for single-cell multiome data. This framework enables the construction of subpopulation-specific regulatory networks and provides a comprehensive R package for advanced multi-omics data integration and analysis.
