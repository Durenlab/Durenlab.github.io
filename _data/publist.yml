- title: "Integration of single-cell multi-omics data by regression analysis on unpaired observations"
  image: unPairReg.png
  description: We propose UnpairReg for regression analysis on unpaired observations to integrate single-cell multi-omics data. UnpairReg provides accurate estimations of gene expression from chromatin accessibility and infers regulatory networks consistent with eQTL mapping, improving cell type identification accuracy.
