  description: We present LINGER, a machine-learning method to infer gene regulatory networks from single-cell paired data. LINGER incorporates atlas-scale external bulk data across diverse cellular contexts and prior knowledge of transcription factor motifs as a manifold regularization to achieve high-accuracy inference.
